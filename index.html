<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kim — personal English coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F6F4; --ink:#141414; --muted:#5C5C5C;
  --line:#E4E4E1; --line2:#CFCFCB; --accent:#F26B1D; --accent-soft:#FDE7D6; --accent-ink:#FFFFFF;
  --warn:#B4472C; --warn-soft:#F6E2DB; --gold:#9A761B; --gold-soft:#F2E9D2;
  --shadow:0 1px 0 rgba(20,20,20,.05);
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --r:10px;
}
/* fixed light + orange scheme by request — same in dark mode and with data-theme overrides */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F6F4; --ink:#141414; --muted:#5C5C5C;
    --line:#E4E4E1; --line2:#CFCFCB; --accent:#F26B1D; --accent-soft:#FDE7D6; --accent-ink:#FFFFFF;
    --warn:#B4472C; --warn-soft:#F6E2DB; --gold:#9A761B; --gold-soft:#F2E9D2;
    --shadow:0 1px 0 rgba(20,20,20,.05);
  }
}
:root[data-theme="dark"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F6F4; --ink:#141414; --muted:#5C5C5C;
  --line:#E4E4E1; --line2:#CFCFCB; --accent:#F26B1D; --accent-soft:#FDE7D6; --accent-ink:#FFFFFF;
  --warn:#B4472C; --warn-soft:#F6E2DB; --gold:#9A761B; --gold-soft:#F2E9D2;
  --shadow:0 1px 0 rgba(20,20,20,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 .7em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--read);font-weight:500;font-size:19px;letter-spacing:-.015em}
.brand em{font-style:italic;color:var(--accent)}
.meta{margin-left:auto;display:flex;gap:14px;align-items:baseline;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.tabs{max-width:820px;margin:0 auto;padding:8px 8px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;position:relative}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;opacity:0}
.tab.pending .dot{opacity:1}
main{max-width:820px;margin:0 auto;padding:18px 16px 96px}
section[hidden]{display:none}

/* ---------- pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:14px}
.lede{font-family:var(--read);font-size:17px;line-height:1.5;color:var(--muted)}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hd h2{font-size:16px}
.hd .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 15px;font-weight:600;font-size:14.5px}
.btn:hover{filter:brightness(0.94)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.g{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.r{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.y{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
textarea,input[type=text],select{
  width:100%;background:var(--surface2);color:var(--ink);border:1px solid var(--line2);
  border-radius:8px;padding:11px 12px;font-family:var(--read);font-size:16.5px;line-height:1.55;resize:vertical
}
select,input[type=text]{font-family:var(--ui);font-size:15px}
label.lab{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.en{font-family:var(--read)}
.quote{font-family:var(--read);font-size:19px;line-height:1.45}
.list{margin:0;padding-left:18px}
.list li{margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* today strip */
.today{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:var(--surface)}
.chip.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.done::before{content:"✓ "}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px var(--accent)}
.chip.on::after{content:" • now";color:var(--muted);font-weight:400}

/* flashcard */
.flash{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:26px 18px}
.flash .phrase{font-family:var(--read);font-size:29px;line-height:1.25;font-weight:500;letter-spacing:-.015em}
@media(max-width:480px){.flash .phrase{font-size:24px}}
@media(max-width:520px){
  main{padding:14px 12px 90px}
  .card{padding:14px}
  .top-in{padding:8px 12px 0}
  .meta{gap:10px;font-size:11.5px}
  .grade{grid-template-columns:repeat(2,1fr)}
  .quote{font-size:17px}
  .flash{min-height:170px;padding:20px 12px}
  .timer{font-size:36px}
}
.flash .prompt{color:var(--muted);font-size:13px;margin-top:14px}
.back{text-align:left;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.back dt{font-size:11.5px;letter-spacing:.02em;color:var(--muted);font-weight:700;margin-top:12px}
.back dt:first-child{margin-top:0}
.back dd{margin:3px 0 0;font-family:var(--read);font-size:16.5px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}
.grade button{border-radius:8px;border:1px solid var(--line2);background:var(--surface);padding:10px 4px;font-size:13px;font-weight:600;line-height:1.2}
.grade button small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.grade button:hover{border-color:var(--ink)}
.grade .g1:hover{border-color:var(--warn);color:var(--warn)}
.grade .g4:hover{border-color:var(--accent);color:var(--accent)}

/* progress bars */
.bar{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.lvlrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.lvlrow .nm{width:126px;max-width:38vw;flex:none;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvlrow .bar{flex:1}
.lvlrow .n{width:30px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:12px;font-family:var(--read);font-size:16.5px;line-height:1.5;white-space:pre-wrap}
.msg.ai{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:3px;align-self:flex-start}
.msg.me{background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:3px;align-self:flex-end}
.msg.sys{align-self:stretch;max-width:100%;font-family:var(--ui);font-size:13.5px;background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin-bottom:7px;font-family:var(--read);font-size:16.5px;line-height:1.4}
.opt:hover{border-color:var(--ink)}
.opt .k{font-family:var(--ui);font-weight:700;font-size:12px;color:var(--muted);margin-right:8px}
.opt.pick-ok{border-color:var(--accent);background:var(--accent-soft)}
.opt.pick-no{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default;opacity:.85}

/* feedback blocks */
.fb{border-left:3px solid var(--line2);padding-left:12px;margin:12px 0}
.fb.ok{border-color:var(--accent)}
.fb.fix{border-color:var(--warn)}
.fb h4{font-size:12.5px;color:var(--muted);letter-spacing:.01em;margin-bottom:3px}
.fb .en{font-size:16.5px}
.strike{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.scoreline{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px dotted var(--line)}
.scoreline b{font-weight:600}
.timer{font-family:var(--read);font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-right:7px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.skel{color:var(--muted);font-size:14px}
.err{background:var(--warn-soft);border:1px solid transparent;color:var(--warn);padding:10px 12px;border-radius:8px;font-size:13.5px;margin:10px 0}
.plan{width:100%;border-collapse:collapse;font-size:13.5px}
.plan td,.plan th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.plan th{color:var(--muted);font-weight:600;font-size:12px}
.plan tr.now{background:var(--accent-soft)}
.plan tr.now td{border-color:transparent}
.streakdots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.streakdots i{width:11px;height:11px;border-radius:3px;background:var(--surface2);border:1px solid var(--line)}
.streakdots i.on{background:var(--accent);border-color:transparent}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Kim — <em>your personal English coach</em></div>
    <div class="meta">
      <span>Day <b id="m-day">1</b>/30</span>
      <span>Cycle <b id="m-cycle">1</b></span>
      <span>Streak <b id="m-streak">0</b></span>
      <span><b id="m-level">B1</b></span>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="cards" aria-selected="true">Anki<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="write" aria-selected="false">Writing<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="speak" aria-selected="false">Speaking<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="listen" aria-selected="false">Listening<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="talk" aria-selected="false">AI conversation<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="mind" aria-selected="false">Mind test<span class="dot"></span></button>
    <button class="tab" role="tab" data-v="prog" aria-selected="false">Progress<span class="dot"></span></button>
  </nav>
</header>

<main>
  <div id="daily-strip"></div>
  <section id="v-cards"></section>
  <section id="v-write" hidden></section>
  <section id="v-speak" hidden></section>
  <section id="v-listen" hidden></section>
  <section id="v-talk" hidden></section>
  <section id="v-mind" hidden></section>
  <section id="v-prog" hidden></section>
  <div class="foot" id="foot" hidden></div>
</main>
<script>

"use strict";
const BUILD = "2026-09-18 · self-contained coaching, context-aware daily practice";
/* ---------- seed phrase bank ----------
   [phrase, meaning, example, [variations], spokenForm, register, naturalness, commonMistake, cefr, category] */
const REG = {c:"Casual", n:"Neutral", p:"Professional", f:"Formal", a:"Academic", vi:"Very informal"};
const NAT = {3:"Natural", 4:"Very natural", 5:"Native-like"};

const SEED = [
// --- everyday conversation ---
["I've been pretty busy lately.","Your recent life has been full — the standard honest answer to \"what have you been up to?\"","\"How've you been?\" \"Busy, actually. I've been pretty busy lately with work.\"",["I've been really busy lately.","I've been pretty tired lately.","I've been feeling stressed lately.","I've been trying to exercise more lately."],"I've been pretty busy lately → \"Ive been pritty bizzy lately\" (been is reduced to /bɪn/)","n",5,"\"I am busy this these days\" — present perfect continuous + lately, not present simple.","B1","Small talk"],
["What have you been up to?","A warm, open \"what's new with you?\" — wider than \"what are you doing?\"","\"Hey! Long time. What have you been up to?\"",["What've you been up to lately?","What are you up to this weekend?","What was he up to?"],"\"Whatcha been up to?\"","c",5,"\"What are you did?\" — keep the fixed chunk *be up to*.","B1","Small talk"],
["Not much, just the usual.","A light, natural answer when nothing special has happened.","\"What have you been up to?\" \"Not much, just the usual — work, gym, sleep.\"",["Nothing much, really.","Same as always.","The usual, honestly."],"","c",5,"\"Nothing. I have no activity.\" sounds translated.","A2","Small talk"],
["How's it going with…?","Asks for an update on something already known between you.","How's it going with the new apartment?",["How's it going with your thesis?","How did it go with the interview?","How's the new job going?"],"\"How's it goin' with…\"","c",4,"\"How is the situation of your apartment?\"","B1","Small talk"],
["Something came up.","A polite, complete reason for cancelling without explaining.","I can't make it tonight — something came up at work.",["Something's come up.","Something urgent came up.","If anything comes up, text me."],"","n",5,"\"Something is happened to me.\"","B1","Making plans"],
["Can we push it to…?","Ask to move a meeting or plan later.","Can we push it to Thursday? I'm swamped tomorrow.",["Can we move it to next week?","Can we push it back an hour?","Let's push it to after lunch."],"","n",4,"\"Can we transfer the schedule?\" — *push* or *move*, not *transfer*.","B1","Making plans"],
["Let me get back to you on that.","You need time before answering — buys time politely and professionally.","Good question. Let me get back to you on that by Friday.",["I'll get back to you.","Let me check and get back to you.","Can I get back to you tomorrow?"],"\"Lemme get back to you.\"","p",5,"\"I will return to you.\" — *get back to*, not *return*.","B1","Work"],
["Sorry, could you say that again?","The natural repair when you didn't catch something.","Sorry, could you say that again? It's a bit noisy here.",["Sorry, I didn't catch that.","Could you repeat that, please?","Sorry, what was that?"],"","n",5,"\"Repeat again please\" — *repeat* already means again.","A2","Clarifying"],

["I'd rather not, if that's okay.","Declines something without giving a reason, and stays warm.","\"Want to talk about it?\" \"I'd rather not, if that's okay.\"",["I'd rather stay in tonight.","I'd rather not say.","I'd rather we talked tomorrow."],"","n",5,"\"I prefer not\" is understandable but stiff in speech.","B2","Declining"],
["I've got to run.","Ends a conversation naturally when you're short on time.","This was great — I've got to run, but let's catch up soon.",["I should get going.","I'd better head off.","I have to run, sorry!"],"\"I gotta run.\"","c",5,"\"I will go now\" ends things abruptly.","B1","Ending conversations"],
["Nice catching up with you.","Warm close after talking with someone you hadn't seen in a while.","Nice catching up with you — say hi to your mom for me.",["Good catching up.","Let's catch up soon.","We should catch up properly sometime."],"","c",5,"\"Nice to meet you\" — only for the first meeting.","B1","Ending conversations"],

["I hadn't thought about it that way.","Concedes that someone gave you a new angle — a C1 conversational move.","Huh. I hadn't thought about it that way.",["I'd never thought of it like that.","That's one way to look at it.","I hadn't considered that."],"","n",5,"Wrong tense: \"I didn't think about it\" changes the meaning.","B2","Reactions"],

// --- linking ---
["so (result)","The everyday spoken connector for result. Beats *therefore* in conversation.","I was really tired, so I decided to go home.",["…, so I just left.","…, so we'll try again tomorrow.","So what I did was…"],"","c",5,"Forcing \"Therefore, I went home\" into casual speech sounds robotic.","A2","Linking"],
["even though","Concedes a fact that makes the main clause surprising. Stronger than *although*.","Even though I was exhausted, I still went.",["Even though it was raining, we walked.","She stayed, even though she didn't have to."],"","n",5,"\"Even though\" + \"but\" in the same sentence — pick one.","B1","Linking"],
["That's why…","Points back to the reason you just gave.","Traffic was insane. That's why I'm late.",["That's why I said no.","That's why it matters.","Which is why I asked."],"","c",5,"\"That is the reason why that…\" — trim it.","B1","Linking"],
["On top of that…","Adds another point, usually another burden or bonus.","The flight was delayed. On top of that, they lost my bag.",["Besides that…","And on top of everything…","Plus…"],"","c",4,"Not for the *first* item in a list.","B2","Linking"],
["At the same time…","Introduces a tension: two true things pulling different ways.","I want the promotion. At the same time, I'm not sure I want the hours.",["Then again…","That said…","On the other hand…"],"","n",5,"Don't use it to mean *simultaneously* in time here — this is rhetorical.","B2","Linking"],
["…, though.","Sentence-final *but* — very common in speech, softer than *however*.","It's expensive. It's worth it, though.",["I liked it, though.","It was fun, though.","Not today, though."],"","c",5,"\"Though\" at the end of a written formal sentence is too casual.","B2","Linking"],
["In other words…","Restates your idea more simply — a key paraphrasing move.","The numbers dropped for three quarters. In other words, we have a problem.",["Basically…","Put simply…","That is to say…"],"","n",5,"Following it with the *same* words defeats the purpose.","B2","Paraphrasing"],
["Anyway…","Closes a digression and returns to the main thread.","…anyway, that's why I couldn't come.",["Anyway, where was I?","Anyways (very informal)","So anyway…"],"","c",5,"In formal writing, use *in any case*.","B1","Linking"],
["By the way…","Introduces a side comment that's not the main topic.","By the way, did you get my message?",["Oh, by the way…","Incidentally (formal)","Before I forget…"],"\"BTW\" in writing","c",5,"Using it for your *main* point undersells it.","B1","Linking"],
["As a result…","Formal result connector — for writing and presentations.","Costs rose sharply. As a result, we paused hiring.",["Consequently…","As a result of the delay…","Which resulted in…"],"","f",4,"Using it in casual chat where *so* fits better.","B2","Linking"],
["whereas","Contrasts two things in one sentence. Written and formal speech.","He prefers working late, whereas I'd rather start early.",["…, whereas the second option is cheaper.","While I like the idea, the cost worries me."],"","f",4,"Not interchangeable with *however* — *whereas* joins clauses.","B2","Linking"],

/* ---------- utilities ---------- */
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const todayKey = ()=> new Date().toLocaleDateString("en-CA");
const dayDiff = (a,b)=> Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const words = s => (String(s||"").trim().match(/[\w''-]+/g)||[]).length;
const rnd = a => a[Math.floor(Math.random()*a.length)];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function pickDaily(arr, dayN, avoid){ // deterministic-ish rotation that never repeats yesterday
  const i = (hash(todayKey()+"|"+arr.length) + dayN) % arr.length;
  let v = arr[i];
  if(avoid!=null && JSON.stringify(v)===JSON.stringify(avoid)) v = arr[(i+1)%arr.length];
  return v;
}
function normalize(s){
  return " "+String(s||"").toLowerCase()
    .replace(/[''`]/g,"'").replace(/[^a-z' ]+/g," ")
    .replace(/\bi am\b/g,"i'm").replace(/\bi have\b/g,"i've").replace(/\bi would\b/g,"i'd").replace(/\bi will\b/g,"i'll")
    .replace(/\bgoing to\b/g,"gonna").replace(/\bwant to\b/g,"wanna").replace(/\s+/g," ")+" ";
}
/* does the text contain the phrase? tolerant of gaps (…), templates (+ -ing),
   notes in brackets, and slash alternatives */
function phraseParts(phrase){
  return String(phrase).split(" / ").map(alt=>
    alt.replace(/\(.*?\)/g,"")          // "so (result)" -> "so"
       .replace(/\s*\+.*$/,"")           // "I keep + -ing" -> "I keep"
       .split(/…|\.\.\./)
       .map(x=>normalize(x).trim())
       .filter(x=>x.length>3)
  ).filter(parts=>parts.length);
}
function matchable(phrase){ return phraseParts(phrase).length>0; }
function usesPhrase(text, phrase){
  const alts = phraseParts(phrase);
  if(!alts.length) return false;
  const t = normalize(text);
  return alts.some(parts=>{
    let from = 0;
    for(const core of parts){
      const idx = t.indexOf(" "+core, from);
      if(idx<0) return false;
      from = idx + core.length;
    }
    return true;
  });
}

let UID = null, DB = null, SAMPLE = null, SAMPLE_READY = false;

function seedCards(){
  SEED.forEach(r=>{
    const id = "s"+hash(r[0]);
    if(S.cards[id]) return;
    S.cards[id] = {
      id, p:r[0], m:r[1], e:r[2], v:r[3]||[], sp:r[4]||"", r:REG[r[5]]||"Neutral", n:NAT[r[6]]||"Natural",
      mk:r[7]||"", cef:r[8]||"B1", cat:r[9]||"General",
      due:null, iv:0, ease:2.5, reps:0, lapses:0, lvl:1, seen:0,
      use:{prompt:0, write:0, speak:0, spon:0}, added:todayKey()
    };
  });
}

/* ---------- storage ---------- */
const LSKEY = "de.fluency.v1";
let saveTimer=null, saving=false, dirty=false;
const DB_DOC_CAP = 220*1024; // stay safely under the platform's 256 KiB per-document limit
function trim(){
  // generous soft caps — far more history than before, well over 100 KB of real data
  if(S.sessions.length>365) S.sessions = S.sessions.slice(-365);
  if(S.writing.length>60) S.writing = S.writing.slice(-60);
  if(S.speaking.length>60) S.speaking = S.speaking.slice(-60);
  S.writing.forEach(w=>{ if(w.text && w.text.length>1200) w.text = w.text.slice(0,1200); });
  S.speaking.forEach(w=>{ if(w.text && w.text.length>1200) w.text = w.text.slice(0,1200); });
  if(S.convo.turns.length>50) S.convo.turns = S.convo.turns.slice(-50);
  if(S.assessments.length>15) S.assessments = S.assessments.slice(-15);
  // hard safety net: halve the biggest logs until we're under the cap, never touch phrase cards
  let guard = 0;
  while(JSON.stringify(S).length > DB_DOC_CAP && guard++ < 20){
    const opts = [
      ["sessions",8], ["writing",5], ["speaking",5], ["convo.turns",6], ["assessments",4]
    ];
    let did = false;
    for(const [path,min] of opts){
      const arr = path==="convo.turns" ? S.convo.turns : S[path];
      if(arr.length > min){
        const keep = Math.max(min, Math.ceil(arr.length/2));
        const trimmed = arr.slice(-keep);
        if(path==="convo.turns") S.convo.turns = trimmed; else S[path] = trimmed;
        did = true;
      }
    }
    if(!did) break;
  }
  // last resort: drop the oldest AI/conversation-generated cards (never the seed set)
  guard = 0;
  while(JSON.stringify(S).length > DB_DOC_CAP && guard++ < 500){
    const gen = Object.values(S.cards).filter(c=>c.cat==="Generated"||c.cat==="From conversation").sort((a,b)=> (a.added||"").localeCompare(b.added||""));
    if(!gen.length) break;
    delete S.cards[gen[0].id];
  }
}
function save(){
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if(saving){ save(); return; }
  saving = true; dirty=false;
  trim();
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
  if(DB && UID){
    try{ await DB.doc("data/users/"+UID+"/state").set({state:JSON.stringify(S), at:NOW()}); }
    catch(e){ /* keep local copy */ }
  }
  saving = false;
  if(dirty) save();
}
async function load(){
  let local=null;
  try{ local = JSON.parse(localStorage.getItem(LSKEY)||"null"); }catch(e){}
  let remote=null;
  if(DB && UID){
    try{
      const snap = await DB.doc("data/users/"+UID+"/state").get();
      if(snap.exists){ const d=snap.data(); remote = JSON.parse(d.state||"null"); }
    }catch(e){}
  }
  const chosen = (remote && local) ? ((remote.sessions||[]).length >= (local.sessions||[]).length ? remote : local) : (remote||local);
  if(chosen && chosen.v){ S = Object.assign(freshState(), chosen); S.convo = Object.assign({stage:1,turns:[],userTurns:0}, chosen.convo||{}); }
  seedCards();
}

/* ---------- SRS ---------- */
function due(){
  const t = todayKey();
  return Object.values(S.cards).filter(c=> c.due && c.due<=t);
}
function newCards(n){
  return Object.values(S.cards).filter(c=>!c.due)
    .sort((a,b)=>{
      const o = {A1:0,A2:1,B1:2,B2:3,C1:4,C2:5};
      return (o[a.cef]-o[b.cef]) || (hash(a.id)%97)-(hash(b.id)%97);
    }).slice(0,n);
}
function grade(c, g){ // 0 again 1 hard 2 good 3 easy
  c.seen++; S.counts.reviewed++;
  if(g===0){
    c.lapses++; c.ease = Math.max(1.3, c.ease-0.2); c.iv = 0;
    c.due = todayKey();
    if(c.lvl>2) c.lvl = Math.max(2, c.lvl-1);
  }else{
    S.counts.recalled++;
    if(g===1){ c.ease=Math.max(1.3,c.ease-0.15); c.iv = c.iv? Math.max(1, Math.round(c.iv*1.2)) : 1; }
    else if(g===2){ c.iv = c.iv? Math.round(c.iv*c.ease) : 1; }
    else { c.ease=Math.min(3.1,c.ease+0.15); c.iv = c.iv? Math.round(c.iv*c.ease*1.35) : 3; }
    c.reps++;
    const d = new Date(); d.setDate(d.getDate()+Math.max(1,c.iv));
    c.due = d.toLocaleDateString("en-CA");
    if(c.lvl<3 && (g>=2)) c.lvl = Math.min(3, c.lvl+1);
    if(c.lvl<2) c.lvl = 2;
  }
  save();
}
function bumpLevel(c, to, why){
  if(!c) return;
  if(to>c.lvl){ c.lvl = Math.min(7,to); }
  if(why) c.lastWhy = why;
  save();
}
function markUse(c, kind){
  if(!c) return;
  c.use[kind] = (c.use[kind]||0)+1;
  S.counts.used++;
  if(kind==="prompt") bumpLevel(c,4);
  if(kind==="write") bumpLevel(c,5);
  if(kind==="speak") bumpLevel(c,5);
  if(kind==="spon") bumpLevel(c, c.use.spon>=2 ? 7 : 6);
  save();
}
function stateName(c){
  if(!c.due) return "New";
  if(c.lvl>=7) return "Automatic";
  if(c.lvl>=6) return "Spontaneous";
  if(c.lvl>=5) return "Active";
  if(c.lvl>=4) return "Familiar";
  return "Learning";
}
function activePool(n){ // phrases understood but not yet actively used — the ones to force out
  return Object.values(S.cards).filter(c=>c.lvl>=2 && c.lvl<6)
    .sort((a,b)=> (a.lvl-b.lvl) || (b.seen-a.seen)).slice(0,n);
}
function phase(){
  const d = Math.min(30, Math.max(1, S.day));
  return PHASES.find(p=> d>=p.d[0] && d<=p.d[1]) || PHASES[0];
}
function logError(tag){
  if(!tag) return;
  const t = String(tag).toLowerCase().trim();
  const hit = ERR_TAGS.find(x=> t.includes(x) || x.includes(t));
  const key = hit || t.slice(0,28);
  S.errors[key] = (S.errors[key]||0)+1;
}

function splitSents(t){
  return String(t||"").replace(/\s+/g," ").split(/(?<=[.!?])\s+|\s*\n+\s*/).map(x=>x.trim()).filter(x=>x.length>1);
}
function applyRule(sn, r){
  const g = new RegExp(r.re.source, r.re.flags.includes("g")? r.re.flags : r.re.flags+"g");
  let out = r.fn ? sn.replace(g, (...a)=> r.fn(a)) : sn.replace(g, r.to);
  /* a fix at the start of a sentence must not eat the capital letter */
  if(/^[A-Z]/.test(sn) && /^[a-z]/.test(out)) out = out.charAt(0).toUpperCase()+out.slice(1);
  return out.replace(/\s+([.,!?])/g, "$1").replace(/\s{2,}/g," ").trim();
}
function scanText(text, opts){
  const o = opts||{};
  const sents = splitSents(text);
  const findings = [], seen = new Set();
  sents.forEach(sn=>{
    RULES.forEach(r=>{
      if(!r.re.test(sn)) return;
      const better = applyRule(sn, r);
      if(better === sn) return;
      const k = sn+"|"+r.why;
      if(seen.has(k)) return;
      seen.add(k);
      findings.push({mine:sn, better, why:r.why, tag:r.tag, w:r.w});
    });
  });
  /* structural checks */
  const long = sents.filter(s=>words(s)>42);
  if(long.length){
    findings.push({mine:long[0].slice(0,180), better:"Split it: one idea per sentence, then join the two with “so”, “but” or “which”.",
      why:"Past roughly 40 words a sentence stops sounding complex and starts sounding unedited. C1–C2 writing varies length instead.", tag:"sentence variety", w:2});
  }
  const lens = sents.map(words);
  if(sents.length>=4){
    const avg = lens.reduce((a,b)=>a+b,0)/lens.length;
    const spread = Math.max(...lens)-Math.min(...lens);
    if(spread<=5 && avg>8) findings.push({mine:"Your sentences are all about "+Math.round(avg)+" words long.",
      better:"Put one short sentence — five words or fewer — next to a long one.",
      why:"Rhythm comes from contrast in sentence length. Uniform length reads flat even when every sentence is correct.", tag:"sentence variety", w:1});
  }
  const ws = (String(text).toLowerCase().match(/[a-z']+/g)||[]);
  const stop = new Set(["the","a","an","and","or","but","so","because","i","my","me","you","it","is","am","are","was","were","be","been","to","of","in","on","for","that","this","with","as","at","have","has","had","do","did","not","they","we","he","she","his","her","their","there","very","too","also","then","when","if","will","would","can","could","just","really","like","about","more","up","out","one","some","any","them","what","which","from","by","all","get","got"]);
  const freq = {};
  ws.forEach(w=>{ if(w.length>3 && !stop.has(w)) freq[w]=(freq[w]||0)+1; });
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]>=4 && ws.length>40){
    findings.push({mine:"“"+top[0]+"” appears "+top[1]+" times.",
      better:"Replace two of them with a synonym, a pronoun, or drop the clause entirely.",
      why:"Lexical repetition is the clearest ceiling on a B2 text. Range is what moves it to C1.", tag:"repetition", w:2});
  }
  const linkers = LINKWORDS.filter(w=> new RegExp("\\b"+w.replace(/ /g,"\\s")+"\\b","i").test(text));
  if(o.mode!=="sentence" && ws.length>50 && linkers.length<2){
    findings.push({mine:"Almost no linking between your ideas.",
      better:"Join two of your sentences with “so”, “but”, “even though” or “that's why”.",
      why:"Cohesion is scored separately from grammar. Ideas that sit side by side read as a list, not an argument.", tag:"linking words", w:2});
  }
  findings.sort((a,b)=> b.w-a.w);
  return {findings, sents, lens, ws, linkers,
    ttr: ws.length? new Set(ws).size/ws.length : 0};
}
function groupFindings(findings){
  const by = new Map();
  findings.forEach(f=>{
    if(!by.has(f.mine)) by.set(f.mine, {mine:f.mine, better:f.mine, whys:[], w:0});
    const g = by.get(f.mine);
    const r = RULES.find(r=>r.why===f.why);

function localSentence(txt, c){
  const sc = scanText(txt, {mode:"sentence"});
  const hard = sc.findings.filter(f=>f.w>=3);
  const soft = sc.findings.filter(f=>f.w===2);
  let fixed = txt;
  sc.findings.forEach(f=>{ if(f.mine===txt) fixed = applyRule(fixed, RULES.find(r=>r.why===f.why)||{re:/$^/,to:""}); });

  };

function localCards(n){
  const have = new Set(Object.values(S.cards).map(c=>c.p.toLowerCase()));
  const weak = Object.entries(S.errors||{}).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const order = [];
  weak.forEach(t=> (WEAKBANK[t]||[]).forEach(c=> order.push(c)));
  WEAKBANK.__general.forEach(c=> order.push(c));
  Object.keys(WEAKBANK).forEach(k=>{ if(k!=="__general") WEAKBANK[k].forEach(c=> order.push(c)); });
  const out = [];
  for(const c of order){
    if(out.length>=n) break;
    if(have.has(c.phrase.toLowerCase())) continue;
    if(out.some(x=>x.phrase===c.phrase)) continue;
    out.push(c);
  }
  return out;
}

  const p = localProfile();
  const early = S.writing.slice(0,2), late = S.writing.slice(-2);
  const sc = w=> w&&w.scores? Object.values(w.scores).reduce((a,b)=>a+b,0)/Object.values(w.scores).length : null;
  const e0 = sc(early[0]), l0 = sc(late[late.length-1]);
  const moved = (e0!=null && l0!=null) ? (l0-e0) : null;
  const errs = Object.entries(S.errors||{}).sort((a,b)=>b[1]-a[1]);
  const ph = phase();
  return {
    level: S.level,
    improved: [
      moved!=null ? "Overall writing score moved from "+e0.toFixed(1)+" to "+l0.toFixed(1)+" across this cycle." : "Not enough early writing to compare — start the next cycle with a task on day 1.",
      "Phrases now used in your own sentences: "+Object.values(S.cards).filter(c=>c.lvl>=5).length+"."
    ],
    stillWeak: errs.slice(0,3).map(e=>e[0]+" ("+e[1]+")"),
    recurringMistakes: errs.filter(e=>e[1]>=3).map(e=>e[0]),
    newlyActive: Object.values(S.cards).filter(c=>c.use&&c.use.spon>0).map(c=>c.p).slice(0,8),
    stillPassive: Object.values(S.cards).filter(c=>c.lvl>=2&&c.lvl<5).map(c=>c.p).slice(0,8),
    fluencyBlockers: p.fluencyBlockers,
    nextPriority: p.nextThree,
    c2Gap: "C2 isn't more exercises. It's producing nuanced, precise English under time pressure on unfamiliar topics — and you haven't yet been tested on topics you didn't prepare for. That's what the next cycle turns up.",
    nextCycle: {
      theme: errs[0]? "Closing the "+errs[0][0]+" gap while raising spontaneity" : "Spontaneity and precision",
      days1_7: "Rebuild automaticity: short speaking, tight writing, heavy Anki on the weak-spot phrases added this cycle.",
      days8_14: "Storytelling and reasons — every writing task must carry a cause and a consequence.",
      days15_21: "Paraphrasing under pressure: no preparation time, no visible target phrases.",
      days22_30: "Argument and register: defend a position, then say the same thing casually and formally.",
      harder: "Target phrases stop being shown before the task, and the speaking timer goes up one step."
    },
    summary: "You've produced real English this cycle rather than collecting it. The measurable gap is "+(errs[0]?errs[0][0]:"spontaneity")+", and it closes by using the phrases, not by rereading them. Next cycle removes the support earlier."
  };
}

/* ---------- daily set ---------- */
function newDaily(){
  const ph = phase();
  const prev = S.daily || {};
  const pool = activePool(30);
  const targets = [];
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  for(const c of shuffled){ if(targets.length<4) targets.push(c.id); }
  const hidden = shuffled.slice(4,7).map(c=>c.id);
  S.daily = {
    date: todayKey(),
    cards:{done:false, ids:null, goal:0},
    writing:{ topic: pickDaily(BANK.write, S.day, prev.writing&&prev.writing.topic), targets, show: (S.day%3!==0), done:false, fb:null, text:"" },
    speaking:{ topic: pickDaily(BANK.speak, S.day+3, prev.speaking&&prev.speaking.topic), secs: ph.secs[S.day%2], hidden, done:false, fb:null, text:"" },
    listen:{ watch: pickDaily(BANK.watch, S.day, prev.listen&&prev.listen.watch), pod: pickDaily(BANK.pods, S.day, prev.listen&&prev.listen.pod), tt: pickDaily(BANK.tt, S.day, prev.listen&&prev.listen.tt), done:false, extra:null },
    talk:{done:false},
    mind:{done:false, n: mindTestSize(), progress:0, correct:0},
    any:false
  };
  S.counts = {reviewed:0, recalled:0, used:0};
}
function ensureDaily(){
  if(S.daily && S.daily.date===todayKey()) return false;
  if(S.daily && S.daily.any){
    // the previous practice day is finished — advance the cycle counter
    S.day++;
    if(S.day>30){ S.day=1; S.cycle++; S.pendingAssessment=true; }
  }
  newDaily();
  S.convo.taughtToday = false; S.convo.mc = null; S.convo.turns = []; S.convo.userTurns = 0;
  return true;
}
function touchDay(){
  const t = todayKey();
  if(S.lastDone!==t){
    S.streak = (S.lastDone && dayDiff(S.lastDone,t)===1) ? S.streak+1 : 1;
    S.lastDone = t;
    S.sessions.push({d:t, day:S.day, cycle:S.cycle});
  }
  if(S.daily) S.daily.any = true;
  save(); renderMeta();
}
function tasksDone(){
  const d = S.daily||{};
  return {
    cards: !!(d.cards&&d.cards.done), write:!!(d.writing&&d.writing.done),
    speak:!!(d.speaking&&d.speaking.done), listen:!!(d.listen&&d.listen.done), talk:!!(d.talk&&d.talk.done),
    mind: !!(d.mind&&d.mind.done)
  };
}

/* ---------- chrome ---------- */
function renderMeta(){
  $("#m-day").textContent = S.day;

}

const VIEWS = {};
let CUR = "cards";
function go(v){
  CUR = v;

  else { btn.textContent = btn.dataset.lbl||btn.textContent; btn.disabled = false; }
}

let cur = null, shown = false;
function buildQueue(){
  const dq = S.daily.cards;
  if(!dq.ids){
    const fresh = newCards(6).map(c=>c.id);
    const ids = due().map(c=>c.id).concat(fresh);
    dq.ids = ids.sort(()=>Math.random()-0.5).slice(0,22);
    dq.goal = dq.ids.length;
    save();
  }
  dq.ids = dq.ids.filter(id=>!!S.cards[id]);
  return dq.ids;
}
function queueLeft(){ return buildQueue().length; }
VIEWS.cards = function(){
  const host = $("#v-cards");
  const ids = buildQueue();
  host.innerHTML = "";
  const dueN = due().length, newN = Object.values(S.cards).filter(c=>!c.due).length;
  const head = el("div","card tight");
  head.innerHTML = `<div class="hd"><h2>Today's Anki review</h2><span class="sub">${ids.length} left today \u00b7 ${dueN} due \u00b7 ${newN} unseen in the bank</span><div class="spacer"></div></div>
  <div class="note">Phrases, chunks and patterns \u2014 not isolated words. Grade honestly: the schedule only works if "Good" really means you recalled it.</div>`;
  const bar = el("div","row"); bar.style.marginTop="10px";
  const addb = el("button","btn ghost sm","Add new phrases for my weak spots"); 
  addb.onclick = ()=> expandDeck(addb, host);
  bar.appendChild(addb);
  head.appendChild(bar);
  host.appendChild(head);

  cur = ids.length ? S.cards[ids[0]] : null;
  if(!cur){
    const done = el("div","card");
    done.innerHTML = `<div class="quote">Nothing left in the queue.</div>
    <p class="note" style="margin-top:8px">Everything due today has been reviewed. The rest comes back on schedule \u2014 more cards tomorrow, not more today. Move on to writing: that's where these phrases become yours.</p>`;
    const b = el("button","btn accent","Go to today's writing practice"); b.onclick=()=>go("write");
    done.appendChild(b);
    host.appendChild(done);
    if(S.daily && !S.daily.cards.done){ S.daily.cards.done = true; touchDay(); renderMeta(); }
    return;
  }
  shown = false;
  drawCard(host);
};
function drawCard(host){
  const c = cur;
  const box = el("div","card");
  box.innerHTML = `<div class="flash"><div class="phrase en">${esc(c.p)}</div>
    <div class="prompt">${c.due? "Say the meaning and a sentence out loud — then check." : "New phrase. Read it aloud first."}</div></div>`;
  const reveal = el("button","btn accent","Show the card");
  reveal.style.width="100%";
  reveal.onclick = ()=>{
    if(shown) return; shown = true;
    reveal.remove();
    box.insertAdjacentHTML("beforeend", detailHTML(c));
    box.appendChild(gradeRow());
    if(c.lvl>=3) box.appendChild(challengeBlock(c));
  };
  box.appendChild(reveal);
  host.appendChild(box);
}
function gradeRow(){
  const g = el("div","grade");
  const nx = (iv,ease,kind)=>{
    const c = cur;
    if(kind===0) return "today";
    let v;
    if(kind===1) v = c.iv? Math.max(1,Math.round(c.iv*1.2)):1;
    else if(kind===2) v = c.iv? Math.round(c.iv*c.ease):1;
    else v = c.iv? Math.round(c.iv*c.ease*1.35):3;
    return v===1? "1 day" : v+" days";
  };
  [["Again","g1",0],["Hard","g2",1],["Good","g3",2],["Easy","g4",3]].forEach(([lbl,cls,k])=>{
    const b = el("button",cls);
    b.innerHTML = esc(lbl)+"<small>"+esc(nx(0,0,k))+"</small>";
    b.onclick = ()=>{
      const id = cur.id;
      grade(cur,k);
      const ids = S.daily.cards.ids.filter(x=>x!==id);
      if(k===0) ids.push(id);              // "Again" comes back at the end of today's queue
      S.daily.cards.ids = ids;
      cur=null; touchDay(); save(); VIEWS.cards(); renderMeta();
    };
    g.appendChild(b);
  });
  return g;
}
function challengeBlock(c){
  const w = el("div"); w.style.marginTop="14px";
  w.innerHTML = `<hr class="sep"><label class="lab">Active-use challenge — write your own sentence with this phrase. Make it true about your life.</label>`;
  const ta = el("textarea"); ta.rows=2; ta.placeholder="Your sentence…";
  w.appendChild(ta);
  const row = el("div","row"); row.style.marginTop="8px";
  const b = el("button","btn sm","Check my sentence"); 
  const out = el("div");
  b.onclick = async ()=>{
    const txt = ta.value.trim();
    out.innerHTML="";
    if(!txt){ ta.focus(); return; }
    if(matchable(c.p) && !usesPhrase(txt, c.p)){
      out.innerHTML = `<div class="err">That sentence doesn't actually contain <b>${esc(c.p)}</b>. Use the phrase itself — that's the whole point of the drill.</div>`;
      return;
    }
    busy(b,true,"Checking…");
    {
      let r = localSentence(txt, c);
      const rr = await askJSON([{role:"user",content:
        COACH+"\n\n"+learnerBrief()+
        "\n\nThe learner was asked to use this phrase in their own sentence.\nPHRASE: "+c.p+"\nMEANING: "+c.m+
        "\nTHEIR SENTENCE: "+txt+
        "\n\nJudge whether they used the phrase correctly and naturally. Reply with ONLY this JSON:\n"+
        '{"verdict":"correct|incorrect|awkward","fixed":"minimally corrected version, or their sentence unchanged","elevated":"how a C1 speaker would say the same thing","why":["one-line reason","optional second"],"praise":"one specific thing they got right, or empty string","errorTags":["articles"],"next":"a short follow-up prompt forcing them to use the phrase again about something else"}'
      }],{modelTier:"quick", cache:false});
      if(rr && rr.verdict) r = rr;
      busy(b,false);
      (r.errorTags||[]).forEach(logError);
      const ok = r.verdict==="correct";
      if(ok || r.verdict==="awkward") markUse(c,"prompt");
      out.innerHTML = `
        <div class="fb ${ok?"ok":"fix"}">
          <h4>${ok?"Used correctly":"Nearly"}</h4>
          ${r.praise?`<p class="note">${esc(r.praise)}</p>`:""}
          ${r.fixed && r.fixed.trim()!==txt ? `<h4>Fixed</h4><div class="en">${esc(r.fixed)}</div>`:""}
          ${r.elevated?`<h4>How a C1 speaker would say it</h4><div class="en">${esc(r.elevated)}</div>`:""}
          ${(r.why||[]).length?`<h4>Why</h4><ul class="list">${(r.why||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
          ${r.next?`<h4>Your turn again</h4><p class="note">${esc(r.next)}</p>`:""}
        </div>`;
      if(ok) out.insertAdjacentHTML("afterbegin",`<p class="note">Memory level: <b>${esc(LVL_NAMES[c.lvl])}</b></p>`);
    }
  };
  row.appendChild(b);
  const skip = el("button","btn ghost sm","Skip");
  skip.onclick = ()=> w.remove();
  row.appendChild(skip);
  w.appendChild(row); w.appendChild(out);
  return w;
}
async function expandDeck(btn, host){
  busy(btn,true,"Writing new cards…");
  const have = Object.values(S.cards).map(c=>c.p);
  const weak = Object.entries(S.errors).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]).join(", ")||"none yet";
  {
    let r = localCards(8);
    const rr = await askJSON([{role:"user",content:
      COACH+"\n\n"+learnerBrief()+
      "\n\nWrite 8 NEW phrase cards for this learner. Target their recurring errors ("+weak+") and the next level up from "+S.level+
      ". Teach chunks, sentence frames and collocations that a learner at this stage can use this week — not rare idioms."+
      "\nDo NOT repeat any of these phrases: "+have.slice(0,160).join(" | ")+
      '\n\nReply with ONLY a JSON array of 8 objects: {"phrase":"","meaning":"","example":"","variations":["","",""],"spoken":"contraction/reduction note or empty","register":"Casual|Neutral|Professional|Formal|Academic|Very informal","naturalness":"Natural|Very natural|Native-like","mistake":"the common learner mistake with this chunk","cefr":"B1|B2|C1|C2","category":"short label"}'
    }],{modelTier:"default", cache:false});
    if(Array.isArray(rr) && rr.length) r = rr;
    busy(btn,false);
    let added = 0;
    (Array.isArray(r)?r:[]).forEach(o=>{
      if(!o||!o.phrase) return;
      const id = "a"+hash(o.phrase);
      if(S.cards[id]) return;
      S.cards[id] = {id, p:o.phrase, m:o.meaning||"", e:o.example||"", v:o.variations||[], sp:o.spoken||"",
        r:o.register||"Neutral", n:o.naturalness||"Natural", mk:o.mistake||"", cef:o.cefr||"B2", cat:o.category||"Generated",
        due:null, iv:0, ease:2.5, reps:0, lapses:0, lvl:1, seen:0, use:{prompt:0,write:0,speak:0,spon:0}, added:todayKey()};
      added++;
    });
    save();
    S.daily.cards.ids = null; buildQueue();
    const msg = el("div","card tight");
    msg.innerHTML = added
      ? `<div class="note">${added} new phrase${added===1?"":"s"} added, chosen for your recorded weak spots (${esc(weak)}). They'll start appearing in the queue.</div>`
      : `<div class="note">Nothing new to add for your current weak spots — the targeted phrases are already in the bank. Do more writing and speaking and the tracker will find the next gap.</div>`;
    host.insertBefore(msg, host.children[1]||null);
  }
}

function reconsiderLevel(){
  const recent = S.writing.slice(-5).map(w=>w.band).filter(Boolean);
  if(recent.length<3) return;
  const order = ["A1","A2","B1","B2","C1","C2"];
  const counts = {};
  recent.forEach(b=> counts[b]=(counts[b]||0)+1);
  const top = Object.entries(counts).sort((a,b)=> b[1]-a[1] || order.indexOf(a[0])-order.indexOf(b[0]))[0];
  if(top && top[1]>=3) S.level = top[0];
}

  {re:/\b(comedy|comedies)\b/i, said:"Comedy's a solid choice when you just want to switch off for a bit."},
  {re:/\b(horror)\b/i, said:"Not everyone can handle horror right before bed — that takes nerve."},

  {re:/\b(exhausted|drained|burnt out|burned out)\b/i, said:"That kind of tired doesn't usually go away with one good night's sleep."}
];
const TOPIC_FOLLOWUP = {
  work:["What's making it like that lately?","How are you handling that so far?","Does that happen a lot, or is this a one-off?"],
  media:["Is there one you've watched recently that you really enjoyed?","Would you actually recommend it?","How'd you end up finding that one?"],
  people:["How are they doing?","Do you see them often?","What's that like for you?"],
  feeling:["What's behind that, do you think?","Has it been like that for a while?","What would help right now?"],
  time:["What are you planning to do about it?","How'd that go, in the end?","Got anything else lined up?"],
  general:["What happened next?","How did that go?","What made you think that?","Why do you say that?"]
};
const REACT_OPEN = ["That makes sense.","Oh, I see.","Right, okay.","Really?","Huh, interesting.","I get that.","Fair enough.","No way.","Okay, that tracks."];
const PLAIN_COMMENT = ["Fair enough.","Yeah, I get that.","Makes sense to me.","I can see that.","That sounds about right.","Okay, noted."];
function topicOf(text){
  const t = text.toLowerCase();
  for(const k in OPENERS) if(new RegExp("\\b"+k+"\\b").test(t)) return OPENERS[k];
  return "general";
}
function detailComment(text){
  for(const d of DETAIL_COMMENT) if(d.re.test(text)) return d.said;
  return null;
}
function contextualReply(C, txt){
  const topic = topicOf(txt);
  const react = rnd(REACT_OPEN);
  const detail = detailComment(txt);
  const priorMine = C.turns.filter(t=>t.r==="me").slice(0,-1);

  /* occasionally, and never on the opening turn, just comment — not every turn needs a question */
  if(priorMine.length>=1 && Math.random()<0.25){
    return detail ? react+" "+detail : react+" "+rnd(PLAIN_COMMENT);
  }
  /* refer back to something said two or more turns ago, sometimes */
  if(priorMine.length>=2 && Math.random()<0.3){
    const back = priorMine[priorMine.length-1].t;
    const short = back.length>60 ? back.slice(0,57)+"…" : back;
    const follow = rnd(TOPIC_FOLLOWUP[topic]||TOPIC_FOLLOWUP.general);
    return react+" By the way, you mentioned \u201c"+short+"\u201d earlier \u2014 "+follow.charAt(0).toLowerCase()+follow.slice(1);
  }
  const follow = rnd(TOPIC_FOLLOWUP[topic]||TOPIC_FOLLOWUP.general);
  return detail ? react+" "+detail+" "+follow : react+" "+follow;
}

function renderMC(host){
  const C = S.convo;
  const box = el("div","card");
  host.appendChild(box);
  if(!C.mc){
    box.innerHTML = `<p class="lede">A short, realistic exchange. Pick the response that sounds like a person, not a textbook.</p>`;
    const b = el("button","btn accent","Start an exchange");
    b.onclick = ()=>{
      const item = pickDaily(CONVOS, S.day + (C.turns.length||0) + Math.floor(Math.random()*CONVOS.length));
      C.mc = {item, picked:null, understood:null};
      save(); VIEWS.talk();
    };
    box.appendChild(b);
    if(S.day>1 || (S.writing&&S.writing.length)){
      const skip = el("button","btn ghost sm","Skip straight to conversation");
      skip.style.marginLeft="8px";
      skip.onclick = ()=>{ C.taughtToday=true; C.turns=[{r:"ai",t:rnd(REACTIONS)}]; C.userTurns=0; save(); VIEWS.talk(); };
      box.appendChild(skip);
    }
    return;
  }
  const {item, picked} = C.mc;
  box.innerHTML = `<p class="note">${esc(item.situation||"")}</p>
    <div class="chat"><div class="msg ai">${esc(item.aiLine||"")}</div></div>`;
  const opts = el("div");
  (item.options||[]).forEach(o=>{
    const b = el("button","opt");
    b.innerHTML = `<span class="k">${esc(o.id)}</span>${esc(o.text)}`;
    if(picked){
      b.disabled = true;
      if(o.id===item.correctId) b.classList.add("pick-ok");
      else if(o.id===picked) b.classList.add("pick-no");
    } else {
      b.onclick = ()=>{ C.mc.picked = o.id; if(o.id!==item.correctId && o.verdict) logError(o.verdict==="grammar"?"verb tense":"unnatural phrasing"); save(); VIEWS.talk(); };
    }
    opts.appendChild(b);
  });
  box.appendChild(opts);
  if(!picked) return;

  const ex = el("div");
  ex.innerHTML = `<hr class="sep"><label class="lab">Every option, and why</label>` +
    (item.options||[]).map(o=>`<div class="fb ${o.id===item.correctId?"ok":"fix"}">
      <h4>${esc(o.id)} — ${esc({natural:"Natural",stiff:"Understandable but stiff",grammar:"Grammar problem","off-topic":"Doesn't answer the question"}[o.verdict]||o.verdict||"")}</h4>
      <div class="en">${esc(o.text)}</div><p class="note">${esc(o.why||"")}</p></div>`).join("");
  const t = item.target||{};
  if(t.phrase){
    ex.insertAdjacentHTML("beforeend", `<hr class="sep"><label class="lab">The chunk worth keeping</label>
      <div class="quote en">${esc(t.phrase)}</div>
      <p class="note" style="margin-top:6px">${esc(t.meaning||"")}</p>
      ${(t.variations||[]).length?`<div class="fb"><h4>Variations</h4>${(t.variations||[]).map(v=>`<div class="en">${esc(v)}</div>`).join("")}</div>`:""}
      <div class="row"><span class="pill">${esc(t.register||"Neutral")}</span><span class="pill g">${esc(t.naturalness||"Natural")}</span></div>
      <p class="note" style="margin-top:8px">${esc(t.when||"")}</p>`);
  }
  box.appendChild(ex);
  saveTarget(t);

  /* controlled production — judged locally from the text, no AI */
  const prod = el("div");
  prod.innerHTML = `<hr class="sep"><label class="lab">Now you say it. Answer this in your own words, using the pattern if you can.</label>
    <div class="quote">${esc(item.aiLine||"")}</div>`;
  const ta = el("textarea"); ta.rows=3; ta.style.marginTop="8px"; ta.placeholder="Your own answer…";
  prod.appendChild(ta);
  const out = el("div");
  const b2 = el("button","btn sm","Check my answer"); b2.style.marginTop="8px";
  b2.onclick = ()=>{
    const txt = ta.value.trim(); if(!txt) return;
    const r = localJudge(txt, t.phrase);
    const card = Object.values(S.cards).find(c=> c.p===t.phrase);
    if(card && r.usedTarget) markUse(card,"prompt");
    out.innerHTML = `<div class="fb ${r.usedTarget?"ok":"fix"}"><h4>${r.usedTarget?"Used the target phrase":"Didn't use the target phrase"}</h4>
        ${r.usedTarget?`<p class="note">Nice — that's exactly the point of the drill.</p>`:`<p class="note">Try folding in: <b>${esc(t.phrase)}</b></p>`}</div>
      <div class="row" style="margin:8px 0"><span class="pill ${r.length==="short"?"r":"g"}">${r.length==="short"?"a bit short":"good length"}</span>
        <span class="pill ${r.linking?"g":""}">${r.linking?"linked ideas":"no linking word"}</span>
        <span class="pill ${r.contraction?"g":""}">${r.contraction?"used a contraction":"no contraction"}</span></div>
      <div class="fb"><h4>A model answer</h4><div class="en">${esc(modelAnswer(t))}</div></div>
      <div class="chat" style="margin-top:12px"><div class="msg ai">${esc(rnd(REACTIONS))}</div></div>`;
    S.daily.talk.done = true; touchDay(); renderMeta();
    const nx = el("div","row");
    const a = el("button","btn accent sm","Keep this conversation going");
    a.onclick = ()=>{ S.convo.taughtToday=true; S.convo.turns=[{r:"ai",t:rnd(REACTIONS)}]; S.convo.userTurns=0; S.convo.mc=null; save(); VIEWS.talk(); };
    const b3 = el("button","btn ghost sm","New exchange");
    b3.onclick = ()=>{ S.convo.mc=null; save(); VIEWS.talk(); };
    nx.appendChild(a); nx.appendChild(b3); out.appendChild(nx);
    save();
  };
  prod.appendChild(b2); prod.appendChild(out);
  box.appendChild(prod);
}
function modelAnswer(t){
  if(!t||!t.phrase) return "";
  const p = t.phrase.replace(/…|\.\.\.|\(.*?\)|\+.*$/g,"").trim();
  return p.endsWith(".")||p.endsWith("!")||p.endsWith("?") ? p+" That's roughly how I'd put it, anyway." : p+" — that's how I'd put it.";
}
function localJudge(text, targetPhrase){
  const n = words(text);
  const lower = " "+text.toLowerCase()+" ";
  return {
    usedTarget: targetPhrase ? (matchable(targetPhrase) ? usesPhrase(text, targetPhrase) : lower.includes(" "+targetPhrase.toLowerCase().slice(0,12))) : false,
    length: n<6 ? "short" : "ok",
    linking: LINKWORDS.some(w=> lower.includes(" "+w+" ")),
    contraction: /\b\w+'\w+\b/.test(text)
  };
}
function saveTarget(t){
  if(!t||!t.phrase) return;
  const id = "t"+hash(t.phrase);
  if(S.cards[id]) { bumpLevel(S.cards[id],2); return; }
  S.cards[id] = {id, p:t.phrase, m:t.meaning||"", e:"", v:t.variations||[], sp:"", r:t.register||"Neutral", n:t.naturalness||"Natural",
    mk:"", cef:"B2", cat:"From conversation", due:null, iv:0, ease:2.5, reps:0, lapses:0, lvl:2, seen:1,
    use:{prompt:0,write:0,speak:0,spon:0}, added:todayKey()};
  save();
}

/* ---- free chat: local reactions + silent phrase tracking, no AI, no mic ---- */
function renderChat(host){
  const C = S.convo;
  const box = el("div","card");
  const log = el("div","chat");
  C.turns.forEach(t=>{
    const m = el("div","msg "+(t.r==="me"?"me":t.r==="sys"?"sys":"ai"));
    if(t.r==="sys") m.innerHTML = t.t; else m.textContent = t.t;
    log.appendChild(m);
  });
  box.appendChild(log);
  const ta = el("textarea"); ta.rows=2; ta.placeholder = C.turns.length? "Your reply…" : "Say anything to start — or press Open with a topic.";
  box.appendChild(ta);
  const row = el("div","row"); row.style.marginTop="8px";
  const send = el("button","btn accent","Send");
  const fbb = el("button","btn ghost sm","Session summary");
  row.appendChild(send); row.appendChild(fbb);
  if(!C.turns.length){
    const op = el("button","btn ghost sm","Open with a topic");
    op.onclick = ()=>{ ta.value = rnd(BANK.speak); };
    row.appendChild(op);
  }
  box.appendChild(row);
  const out = el("div"); box.appendChild(out);
  host.appendChild(box);
  ta.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) send.click(); });

  function doSend(){
    const txt = ta.value.trim(); if(!txt) return;
    ta.value=""; out.innerHTML="";
    C.turns.push({r:"me", t:txt}); C.userTurns++;
    log.appendChild(el("div","msg me", txt));
    const hits = Object.values(S.cards).filter(c=> c.lvl>=2 && c.lvl<7 && matchable(c.p) && usesPhrase(txt,c.p));
    hits.slice(0,4).forEach(c=> markUse(c,"spon"));
    if(hits.length){
      const s = el("div","msg sys");
      s.innerHTML = "Noticed: you used <b>"+hits.slice(0,3).map(c=>esc(c.p)).join("</b>, <b>")+"</b> without being prompted. That counts as spontaneous use.";
      log.appendChild(s); C.turns.push({r:"sys", t:s.innerHTML});
    }
    const reply = contextualReply(C, txt);
    C.turns.push({r:"ai", t:reply});
    log.appendChild(el("div","msg ai", reply));
    S.daily.talk.done = true; touchDay(); renderMeta(); save();
    if(C.userTurns % 4 === 0) sessionSummary(out);
  }
  send.onclick = doSend;
  fbb.onclick = ()=> sessionSummary(out);

  function sessionSummary(target){
    const mineTurns = C.turns.filter(t=>t.r==="me");
    if(!mineTurns.length){ target.innerHTML = `<div class="note">Send a message first — the summary is built from what you actually typed.</div>`; return; }
    const usedIds = new Set();
    mineTurns.forEach(t=> Object.values(S.cards).forEach(c=>{ if(matchable(c.p) && usesPhrase(t.t,c.p)) usedIds.add(c.id); }));
    const used = [...usedIds].map(cardById).filter(Boolean);
    const avgLen = Math.round(mineTurns.reduce((a,t)=>a+words(t.t),0)/mineTurns.length);
    const linked = mineTurns.filter(t=>{const l=" "+t.t.toLowerCase()+" "; return LINKWORDS.some(w=>l.includes(" "+w+" "));}).length;
    target.innerHTML = `<hr class="sep">
      <div class="scoreline"><span>Turns sent</span><b>${mineTurns.length}</b></div>
      <div class="scoreline"><span>Average length</span><b>${avgLen} words</b></div>
      <div class="scoreline"><span>Turns with a linking word</span><b>${linked}</b></div>
      <div class="scoreline"><span>Known phrases used</span><b>${used.length}</b></div>
      ${used.length?`<div class="fb ok"><h4>You used</h4>${used.map(c=>`<div class="en">${esc(c.p)}</div>`).join("")}</div>`:`<div class="fb fix"><h4>Try weaving in a phrase you know</h4><p class="note">${(activePool(3).map(c=>esc(c.p)).join(" · ")||"Keep chatting to build up your active pool.")}</p></div>`}`;
  }
}

const MIND_CAT_NAMES = {problem:"Problem solving", analytical:"Analytical thinking", logic:"Logic", grammar:"Grammar reasoning",
  vocab:"Vocabulary reasoning", inference:"Reading & inference", memory:"Memory", verbal:"Verbal reasoning",
  pattern:"Pattern recognition", factop:"Fact, opinion or assumption", spoterror:"Spot the error", perspective:"Multiple perspectives",
  decision:"Decision making", langlogic:"Language & logic"};
function mindTestSize(){
  const h = (S.mind&&S.mind.history||[]).slice(-10);
  if(h.length<3) return 4;
  const acc = h.filter(x=>x.ok).length/h.length;
  if(acc>=0.85) return 3;   // strong: fewer questions, harder ones instead
  if(acc<0.5) return 5;     // weak: a bit more targeted practice
  return 4;                 // average
}
function mindDifficulty(){
  const h = (S.mind&&S.mind.history||[]).slice(-8);
  const acc = h.length? h.filter(x=>x.ok).length/h.length : 0.5;
  const base = Math.min(3, phase().stage+1); // levels 1-4, cycle phase nudges the floor
  if(h.length<4) return Math.max(1, base-1);
  if(acc>=0.8) return Math.min(4, base+1);
  if(acc<0.4) return Math.max(1, base-1);
  return base;
}

    {level:2, prompt:"You have one hour. Task A is urgent but low importance (15 min). Task B is important but not urgent (40 min). Task C takes 10 minutes and is needed before tomorrow. What's the most reasonable approach?", options:["Do A first because it's urgent","Do C and B, skip or defer A since it's low importance despite feeling urgent","Do all three at once","Do B only"], correct:1, why:"Urgency without importance is the classic trap — C is a real deadline and B has lasting value; A being merely urgent doesn't make it worth the time."},
    {level:3, prompt:"You're choosing between finishing a task perfectly (2 more hours) or submitting a solid version now and improving it later if needed. Deadline is in 90 minutes. What's more reasonable?", options:["Keep perfecting it past the deadline","Submit the solid version on time and iterate afterward if there's room to", "Ask for an extension automatically","Abandon the task"], correct:1, why:"When perfection would blow the deadline, a solid on-time version beats a better late one — you can usually still improve it afterward, but you can't undo a missed deadline."}
  ],
  langlogic:[
    {level:2, prompt:"“Although Sarah was tired, she finished the report before leaving.” What does “although” communicate here?", options:["Cause","Contrast","Result","Sequence"], correct:1, why:"“Although” signals a contrast — an expected obstacle (tiredness) that didn't stop the outcome."},
    {level:3, prompt:"“Since the client hadn't replied, we assumed the deal was off.” What does “since” mean here?", options:["From that time onward","Because","Contrast","Sequence"], correct:1, why:"Here “since” means “because” (a reason), not a point in time — a common ambiguity in English that context resolves."}
  ]
};
function pickMindQuestion(cats, diff, askedIdx){
  const pool = [];
  cats.forEach(cat=> (MIND_BANK[cat]||[]).forEach((q,i)=>{
    if(Math.abs(q.level-diff)<=1) pool.push({...q, cat, i});
  }));
  const fresh = pool.filter(q=> !askedIdx.has(q.cat+q.i));
  const from = fresh.length? fresh : pool;
  return from.length? rnd(from) : null;
}
/* pick a category weighted toward the ones with lower recorded accuracy,
   so recurring weaknesses get more practice without ever locking out the rest */
function weightedCategory(cats){
  const stats = S.mind.cat || {};
  const weights = cats.map(c=>{
    const s = stats[c];
    if(!s || s.total<2) return 1.4; // give under-tested categories a slight boost too
    const acc = s.ok/s.total;
    return 0.4 + (1-acc)*1.6; // lower accuracy -> higher weight, floor so nothing goes to zero
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<cats.length;i++){ r -= weights[i]; if(r<=0) return cats[i]; }
  return cats[cats.length-1];
}
const ALL_CATS = ["problem","analytical","logic","grammar","vocab","inference","verbal","pattern","factop","spoterror","perspective","decision","langlogic","memory"];
/* not every category shows up every day — pick a small daily subset, weighted so
   recurring weaknesses are guaranteed a slot, with the rest filled in for variety */
function todaysCategories(n){
  const stats = S.mind.cat || {};
  const weak = Object.keys(stats).filter(c=> stats[c].total>=2 && stats[c].ok/stats[c].total<0.55);
  const rest = ALL_CATS.filter(c=> !weak.includes(c) && c!=="memory");
  const shuffledRest = rest.slice().sort(()=>Math.random()-0.5);
  const picked = [...new Set([...weak.slice(0,2), ...shuffledRest])].slice(0, Math.max(3, Math.min(5,n+1)));
  if(Math.random()<0.25 && !picked.includes("memory")) picked.push("memory");
  return picked;
}
function mindSession(){
  const d = S.daily.mind;
  if(!d.set){
    const diff = mindDifficulty();
    const cats = todaysCategories(d.n);
    S.mind.recentQ = S.mind.recentQ || [];
    const asked = new Set(S.mind.recentQ.slice(-25));
    const set = [];
    for(let k=0;k<d.n;k++){
      const cat = weightedCategory(cats);
      let q = pickMindQuestion([cat], diff, asked);
      if(!q) q = pickMindQuestion(cats, diff, asked);
      if(!q) q = pickMindQuestion(ALL_CATS, diff, asked);
      if(q){ asked.add(q.cat+q.i); set.push(q); S.mind.recentQ.push(q.cat+q.i); }
    }
    S.mind.recentQ = S.mind.recentQ.slice(-50);
    d.set = set; d.answers = [];
  }
  return d;
}
VIEWS.mind = function(){
  const host = $("#v-mind");
  host.innerHTML = "";
  const d = mindSession();
  const idx = d.progress||0;

  if(idx >= d.set.length){
    const correct = d.answers.filter(a=>a.ok).length;
    const acc = d.answers.length? Math.round(100*correct/d.answers.length) : 0;
    const byCat = {};
    d.answers.forEach(a=>{ byCat[a.cat]=byCat[a.cat]||{ok:0,total:0}; byCat[a.cat].total++; if(a.ok)byCat[a.cat].ok++; });
    const entries = Object.entries(byCat);
    const strongest = entries.filter(([,v])=>v.ok===v.total).map(([k])=>MIND_CAT_NAMES[k]||k)[0];
    const weakest = entries.filter(([,v])=>v.ok<v.total).sort((a,b)=>(a[1].ok/a[1].total)-(b[1].ok/b[1].total))[0];
    const diffLabel = {1:"Basic",2:"Intermediate",3:"Advanced",4:"C2 / expert"}[mindDifficulty()]||"Intermediate";
    const explainedOne = d.answers.find(a=>a.explainText);
    const done = el("div","card");
    done.innerHTML = `<div class="hd"><h2>Today's mind test</h2><span class="sub">done</span></div>
      <div class="scoreline"><span>Questions</span><b>${d.answers.length}</b></div>
      <div class="scoreline"><span>Correct</span><b>${correct}/${d.answers.length}</b></div>
      ${strongest?`<div class="scoreline"><span>Strongest today</span><b>${esc(strongest)}</b></div>`:""}
      ${weakest?`<div class="scoreline"><span>Needs practice</span><b>${esc(MIND_CAT_NAMES[weakest[0]]||weakest[0])}</b></div>`:""}
      <div class="scoreline"><span>Difficulty</span><b>${esc(diffLabel)}</b></div>
      ${explainedOne?`<div class="scoreline"><span>English noted</span><b>reasoning explained in writing</b></div>`:""}
      ${weakest?`<p class="note" style="margin-top:8px">Focus for future practice: ${esc(MIND_CAT_NAMES[weakest[0]]||weakest[0])}.</p>`:`<p class="note" style="margin-top:8px">${acc>=80?"You're ready for a step up in difficulty.":acc<50?"Tomorrow starts a notch easier.":"Difficulty stays about the same."}</p>`}`;
    host.appendChild(done);
    if(!d.done){ d.done=true; touchDay(); renderMeta(); }
    return;
  }

  const q = d.set[idx];
  const box = el("div","card");
  box.innerHTML = `<div class="hd"><h2>Today's mind test</h2><span class="sub">${idx+1} of ${d.set.length} · ${esc(MIND_CAT_NAMES[q.cat]||q.cat)} · level ${q.level}</span></div>
    <div class="quote">${esc(q.prompt)}</div>`;
  if(q.mem){
    const cont = el("button","btn accent","I've got it — ask me");
    box.appendChild(cont);
    const qBox = el("div"); box.appendChild(qBox);
    cont.onclick = ()=>{
      cont.remove();
      qBox.innerHTML = `<p class="lab" style="margin-top:8px">${esc(q.memAsk)}</p>`;
      renderOptions(qBox);
    };
    host.appendChild(box);
    return;
  }
  renderOptions(box);
  host.appendChild(box);

  function renderOptions(target){
    const opts = el("div"); opts.style.marginTop="10px";
    q.options.forEach((o,i)=>{
      const b = el("button","btn ghost sm"); b.style.display="block"; b.style.width="100%"; b.style.textAlign="left"; b.style.marginBottom="6px";
      b.textContent = o;
      b.onclick = ()=> answer(i, target, opts);
      opts.appendChild(b);
    });
    target.appendChild(opts);
  }
  function answer(i, target, opts){
    [...opts.children].forEach(b=> b.disabled=true);
    const ok = i===q.correct;
    S.mind.history = (S.mind.history||[]).concat([{ok, cat:q.cat, d:todayKey()}]).slice(-60);
    S.mind.cat = S.mind.cat || {};
    S.mind.cat[q.cat] = S.mind.cat[q.cat] || {ok:0, total:0};
    S.mind.cat[q.cat].total++;
    if(ok) S.mind.cat[q.cat].ok++;
    const rec = {ok, cat:q.cat};
    d.answers.push(rec);
    d.progress = idx+1; d.correct = (d.correct||0) + (ok?1:0);
    save();
    const fb = el("div","fb "+(ok?"ok":"fix")); fb.style.marginTop="10px";
    fb.innerHTML = `<h4>${ok?"Right":"Not quite"}</h4><p>${esc(q.why)}</p>`;
    target.appendChild(fb);
    const advance = ()=>{
      const nx = el("button","btn accent"); nx.style.marginTop="10px";
      nx.textContent = d.progress<d.set.length ? "Next" : "See today's result";
      nx.onclick = ()=> VIEWS.mind();
      target.appendChild(nx);
    };
    if(q.explain){
      const ex = el("div"); ex.style.marginTop="10px";
      ex.innerHTML = `<label class="lab">Why did you choose that? (optional — a sentence or two, in English)</label>`;
      const ta = el("textarea"); ta.rows=2; ex.appendChild(ta);
      const b2 = el("button","btn ghost sm"); b2.style.marginTop="6px"; b2.textContent="Save my reasoning";
      b2.onclick = ()=>{
        const txt = ta.value.trim();
        if(txt){
          rec.explainText = txt;
          const sc = scanText(txt);
          const note = el("div","note"); note.style.marginTop="6px";
          note.textContent = sc.findings.length ? "Noted — one thing worth a look: "+sc.findings[0].why : "Noted — clean sentence.";
          ex.appendChild(note);
          save();
        }
        b2.disabled = true;
        advance();
      };
      ex.appendChild(b2);
      target.appendChild(ex);
    } else {
      advance();
    }
  }
};

  host.appendChild(dk);

function evidence(){
  const w = S.writing.slice(-4).map(x=>"["+x.d+" · "+(x.band||"?")+"] "+x.topic+" → "+(x.text||"").slice(0,420));
  const s = S.speaking.slice(-3).map(x=>"["+x.d+" · "+(x.wpm||"?")+"wpm] "+x.topic+" → "+(x.text||"").slice(0,420));
  const cards = Object.values(S.cards);
  return [
    "WRITING SAMPLES:\n"+(w.join("\n\n")||"none yet"),
    "SPEAKING TRANSCRIPTS:\n"+(s.join("\n\n")||"none yet"),
    "PHRASES USED SPONTANEOUSLY: "+(cards.filter(c=>c.use.spon>0).map(c=>c.p).join(" | ")||"none"),
    "PHRASES RECOGNISED BUT NEVER USED: "+(cards.filter(c=>c.lvl>=2&&c.lvl<5).map(c=>c.p).slice(0,25).join(" | ")||"none"),
    "ERROR COUNTS: "+(Object.entries(S.errors).sort((a,b)=>b[1]-a[1]).map(e=>e[0]+"="+e[1]).join(", ")||"none")
  ].join("\n\n");
}
async function buildProfile(btn, out){
  busy(btn,true,"Reading your work…");
  {
    let r = localProfile();
    const rr = await askJSON([{role:"user",content:
      COACH+"\n\n"+learnerBrief()+"\n\nEVIDENCE FROM THEIR ACTUAL WORK:\n"+evidence().slice(0,12000)+
      "\n\nBuild their English profile. Base every line on the evidence above — quote or paraphrase what they actually wrote or said. Do not inflate the level and do not criticise unnecessarily. If there isn't enough evidence for a section, say so in that section.\n"+
      'Reply with ONLY this JSON: {"cefr":"A2|B1|B2|C1|C2","cefrWhy":"the evidence for that estimate","strengths":["",""],"weaknesses":["",""],"recurringErrors":["",""],"recognisedNotUsed":["",""],"usedNaturally":["",""],"misused":[""],"understoodNotAutomatic":[""],"fluencyBlockers":["the biggest things stopping natural communication"],"listening":"one line","pronunciation":"one line or unknown","conversational":"one line","nextThree":["priority 1","priority 2","priority 3"]}'
    }],{modelTier:"complex", cache:false});
    if(rr && rr.cefr) r = rr;
    busy(btn,false);
    S.profile = Object.assign({d:todayKey()}, r);
    if(r.cefr) S.level = r.cefr;
    save(); renderMeta(); renderProfile(out, S.profile);
  }
}

    <p class="note">${esc(p.cefrWhy||"")}</p>

    ${L("Recognised but not used",p.recognisedNotUsed)}${L("Used naturally",p.usedNaturally)}${L("Misused",p.misused)}

    ${L("The three things that matter next",p.nextThree)}`;
}
async function runAssessment(btn, out){
  busy(btn,true,"Comparing day 1 with today…");
  {
    let r = localAssess();
    const first = S.writing.slice(0,2).map(x=>"["+x.d+"] "+(x.text||"").slice(0,400)).join("\n\n")||"no early sample";
    const rr = await askJSON([{role:"user",content:
      COACH+"\n\n"+learnerBrief()+
      "\n\nEARLIEST WRITING IN THIS CYCLE:\n"+first+
      "\n\nCURRENT EVIDENCE:\n"+evidence().slice(0,11000)+
      "\n\nThis is the end of a 30-day cycle. Compare the start of the cycle with now, then design the next 30 days. Do not declare a level reached because lessons were completed — require demonstrated performance, and cite it.\n"+
      'Reply with ONLY this JSON: {"level":"A2|B1|B2|C1|C2","improved":["with evidence",""],"stillWeak":["",""],"recurringMistakes":[""],"newlyActive":[""],"stillPassive":[""],"fluencyBlockers":[""],"nextPriority":["","",""],"c2Gap":"what is still missing for C2, concretely","nextCycle":{"theme":"","days1_7":"","days8_14":"","days15_21":"","days22_30":"","harder":"what specifically gets harder, beyond just more vocabulary"},"summary":"3 sentences the learner should remember"}'
    }],{modelTier:"complex", cache:false});
    if(rr && rr.level) r = rr;
    busy(btn,false);
    S.assessments.push({d:todayKey(), cycle:S.cycle, level:r.level, summary:r.summary, full:r});
    if(r.level) S.level = r.level;
    S.pendingAssessment = false;
    save(); renderMeta();
    const L = (t,arr)=> (arr&&arr.length)? `<div class="fb"><h4>${esc(t)}</h4><ul class="list">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
    out.innerHTML = `<hr class="sep"><div class="quote">${esc(r.summary||"")}</div>
      <div class="row" style="margin:10px 0"><span class="pill y">Demonstrated: ${esc(r.level||"")}</span></div>
      ${L("Improved",r.improved)}${L("Still weak",r.stillWeak)}${L("Recurring mistakes",r.recurringMistakes)}
      ${L("Newly active vocabulary",r.newlyActive)}${L("Still passive",r.stillPassive)}${L("Fluency blockers",r.fluencyBlockers)}
      <div class="fb fix"><h4>The gap to C2</h4><p>${esc(r.c2Gap||"")}</p></div>
      ${L("Next three priorities",r.nextPriority)}
      <div class="fb ok"><h4>Next 30 days — ${esc((r.nextCycle||{}).theme||"")}</h4>
        <p class="note">Days 1–7: ${esc((r.nextCycle||{}).days1_7||"")}</p>
        <p class="note">Days 8–14: ${esc((r.nextCycle||{}).days8_14||"")}</p>
        <p class="note">Days 15–21: ${esc((r.nextCycle||{}).days15_21||"")}</p>
        <p class="note">Days 22–30: ${esc((r.nextCycle||{}).days22_30||"")}</p>
        <p class="note"><b>What gets harder:</b> ${esc((r.nextCycle||{}).harder||"")}</p></div>`;
  }
}
